<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Link</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 50px 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px #ddd;
    }
    h1 { color: #333; }
    p { color: #777; }
    a {
      display: block;
      background: #d9e8ff;
      color: #333;
      text-decoration: none;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
    }
    a:hover { background: #bcd5ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Link</h1>
    <p>나의 링크 모음 페이지에 오신 것을 환영합니다!</p>
    <a href="https://www.google.com">Google</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://www.github.com">GitHub</a>
  </div>
</body>
</html>
